<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Tool Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Config (Modo Oscuro / Colores Personalizados) -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-600 rounded-lg text-white">
          <i data-lucide="cpu" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
          Quantum Analytics Tool
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <button id="btn-refresh" class="flex items-center gap-2 px-3 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 transition-colors rounded-md border border-slate-700 text-slate-300">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Actualizar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Grid de Tarjetas / KPI Metric Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Card 1 -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 shadow-lg relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-slate-400">Total Analizado</span>
          <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg">
            <i data-lucide="activity" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4">
          <span class="text-3xl font-extrabold text-white">1,248</span>
          <span class="text-xs text-emerald-400 font-medium ml-2">+12.5% vs ayer</span>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 shadow-lg relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-slate-400">Oportunidades / Valor</span>
          <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
            <i data-lucide="target" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4">
          <span class="text-3xl font-extrabold text-white">18.4%</span>
          <span class="text-xs text-slate-400 font-medium ml-2">Tasa de acierto estimada</span>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 shadow-lg relative overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-slate-400">Estado del Sistema</span>
          <div class="p-2 bg-purple-500/10 text-purple-400 rounded-lg">
            <i data-lucide="zap" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-lg font-bold text-white">En Línea</span>
        </div>
      </div>

    </div>

    <!-- Seccion de Gráfica y Panel de Control -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Contenedor del Gráfico (2 columnas en pantallas grandes) -->
      <div class="lg:col-span-2 bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 shadow-lg flex flex-col justify-between">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="line-chart" class="w-5 h-5 text-brand-500"></i> Tendencia y Rendimiento
          </h2>
        </div>
        <div class="relative w-full h-72">
          <canvas id="performanceChart"></canvas>
        </div>
      </div>

      <!-- Panel de Controles / Entradas de Datos -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 shadow-lg flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 mb-4">
            <i data-lucide="sliders" class="w-5 h-5 text-brand-500"></i> Parámetros de Entrada
          </h2>
          
          <form id="calc-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Valor A</label>
              <input type="number" id="inputA" value="75" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-brand-500 transition-colors">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Valor B</label>
              <input type="number" id="inputB" value="45" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-brand-500 transition-colors">
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-brand-600/20">
              <i data-lucide="calculator" class="w-4 h-4"></i> Calcular Métricas
            </button>
          </form>
        </div>

        <div id="output-result" class="mt-4 p-3 bg-slate-900/80 border border-slate-700/50 rounded-lg text-sm text-slate-300 min-h-[50px] flex items-center justify-center text-center">
          Introduce valores y pulsa calcular.
        </div>
      </div>

    </div>

  </main>

  <!-- Lógica JavaScript Vanilla -->
  <script>
    // Inicializar Iconos de Lucide
    lucide.createIcons();

    // Configuración inicial de Chart.js
    const ctx = document.getElementById('performanceChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul'],
        datasets: [{
          label: 'Rendimiento (%)',
          data: [65, 59, 80, 81, 76, 85, 92],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.35,
          pointBackgroundColor: '#3b82f6'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            grid: { color: 'rgba(51, 65, 85, 0.3)' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            grid: { color: 'rgba(51, 65, 85, 0.3)' },
            ticks: { color: '#94a3b8' }
          }
        }
      }
    });

    // Lógica del Formulario
    document.getElementById('calc-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const valA = parseFloat(document.getElementById('inputA').value) || 0;
      const valB = parseFloat(document.getElementById('inputB').value) || 0;
      
      const resultado = ((valA + valB) / 2).toFixed(2);
      
      document.getElementById('output-result').innerHTML = `
        <span class="text-emerald-400 font-bold">Resultado Calculado: ${resultado}</span>
      `;

      // Actualizar datos del gráfico dinámicamente
      chart.data.datasets[0].data.push(resultado);
      chart.data.labels.push('Nuevo');
      if (chart.data.labels.length > 8) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    });
  </script>
</body>
</html>
