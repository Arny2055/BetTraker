<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet Tracker Pro - Analytics Engine</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }
    .neutral { color: var(--accent-blue); }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: rgba(15, 23, 42, 0.5);
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-win { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .badge-loss { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    .badge-pending { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
  </style>
</head>
<body>

  <h1>Bet Tracker Pro Dashboard</h1>

  <section class="kpi-grid">
    <div class="kpi-card">
      <span class="kpi-title">Banca Actual</span>
      <span class="kpi-value neutral" id="kpi-bankroll">$0.00</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Beneficio Neto</span>
      <span class="kpi-value" id="kpi-profit">$0.00</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Yield</span>
      <span class="kpi-value" id="kpi-yield">0.00%</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Profit Factor</span>
      <span class="kpi-value neutral" id="kpi-pf">0.00</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-title">Win Rate</span>
      <span class="kpi-value neutral" id="kpi-winrate">0.00%</span>
    </div>
  </section>

  <section class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Evento / Selección</th>
          <th>Mercado</th>
          <th>Cuota</th>
          <th>Stake</th>
          <th>Estado</th>
          <th>P&L</th>
        </tr>
      </thead>
      <tbody id="bets-body">
      </tbody>
    </table>
  </section>

  <script>
    const INITIAL_BANKROLL = 1000.00;

    // Estructura de datos normalizada
    const betsData = [
      { id: 1, date: '2026-09-10', event: 'Real Madrid vs Barcelona', market: 'Over 2.5', odds: 1.85, stake: 50.00, status: 'WIN' },
      { id: 2, date: '2026-09-11', event: 'Arsenal vs Chelsea', market: '1X2 - Local', odds: 2.10, stake: 40.00, status: 'LOSS' },
      { id: 3, date: '2026-09-12', event: 'Bayern vs Dortmund', market: 'BTTS - Sí', odds: 1.65, stake: 60.00, status: 'WIN' },
      { id: 4, date: '2026-09-13', event: 'PSG vs Marseille', market: 'Hándicap -1', odds: 1.95, stake: 30.00, status: 'PENDING' }
    ];

    function calculateAnalytics(bets, initialBankroll) {
      let totalStaked = 0;
      let totalReturn = 0;
      let grossProfit = 0;
      let grossLoss = 0;
      let wins = 0;
      let losses = 0;

      bets.forEach(bet => {
        if (bet.status === 'WIN') {
          const profit = (bet.stake * bet.odds) - bet.stake;
          totalStaked += bet.stake;
          totalReturn += (bet.stake * bet.odds);
          grossProfit += profit;
          wins++;
        } else if (bet.status === 'LOSS') {
          totalStaked += bet.stake;
          grossLoss += bet.stake;
          losses++;
        }
      });

      const netProfit = grossProfit - grossLoss;
      const yieldPct = totalStaked > 0 ? (netProfit / totalStaked) * 100 : 0;
      const profitFactor = grossLoss > 0 ? (grossProfit / grossLoss) : (grossProfit > 0 ? grossProfit : 0);
      const totalResolved = wins + losses;
      const winRate = totalResolved > 0 ? (wins / totalResolved) * 100 : 0;
      const currentBankroll = initialBankroll + netProfit;

      return {
        currentBankroll,
        netProfit,
        yieldPct,
        profitFactor,
        winRate
      };
    }

    function renderDashboard() {
      const stats = calculateAnalytics(betsData, INITIAL_BANKROLL);

      document.getElementById('kpi-bankroll').textContent = `$${stats.currentBankroll.toFixed(2)}`;
      
      const profitElem = document.getElementById('kpi-profit');
      profitElem.textContent = `${stats.netProfit >= 0 ? '+' : ''}$${stats.netProfit.toFixed(2)}`;
      profitElem.className = `kpi-value ${stats.netProfit >= 0 ? 'positive' : 'negative'}`;

      const yieldElem = document.getElementById('kpi-yield');
      yieldElem.textContent = `${stats.yieldPct >= 0 ? '+' : ''}${stats.yieldPct.toFixed(2)}%`;
      yieldElem.className = `kpi-value ${stats.yieldPct >= 0 ? 'positive' : 'negative'}`;

      document.getElementById('kpi-pf').textContent = stats.profitFactor.toFixed(2);
      document.getElementById('kpi-winrate').textContent = `${stats.winRate.toFixed(1)}%`;

      const tbody = document.getElementById('bets-body');
      tbody.innerHTML = betsData.map(bet => {
        let pnlText = '-';
        let pnlClass = '';
        let badgeClass = 'badge-pending';

        if (bet.status === 'WIN') {
          const pnl = (bet.stake * bet.odds) - bet.stake;
          pnlText = `+$${pnl.toFixed(2)}`;
          pnlClass = 'positive';
          badgeClass = 'badge-win';
        } else if (bet.status === 'LOSS') {
          pnlText = `-$${bet.stake.toFixed(2)}`;
          pnlClass = 'negative';
          badgeClass = 'badge-loss';
        }

        return `
          <tr>
            <td>${bet.date}</td>
            <td><strong>${bet.event}</strong></td>
            <td>${bet.market}</td>
            <td>${bet.odds.toFixed(2)}</td>
            <td>$${bet.stake.toFixed(2)}</td>
            <td><span class="badge ${badgeClass}">${bet.status}</span></td>
            <td class="${pnlClass}">${pnlText}</td>
          </tr>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderDashboard);
  </script>
</body>
</html>
