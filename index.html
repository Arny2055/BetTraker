<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum BetDevig & EV Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: rgba(18, 26, 43, 0.75);
            --bg-input: rgba(10, 15, 29, 0.85);
            --border-glow: rgba(0, 242, 254, 0.18);
            --accent-cyan: #00f2fe;
            --accent-green: #00ff87;
            --accent-red: #ff3366;
            --accent-amber: #ffaa00;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 18px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .market-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .market-btn {
            flex: 1;
            padding: 12px 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .market-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(0, 255, 135, 0.15));
            color: #ffffff;
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.15);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
            transition: border-color 0.2s;
        }

        .option-card:hover {
            border-color: rgba(0, 242, 254, 0.3);
        }

        .option-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .margin-banner {
            background: rgba(0, 242, 254, 0.04);
            border: 1px dashed rgba(0, 242, 254, 0.25);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .margin-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .margin-item span.label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .margin-item span.val {
            font-size: 1.25rem;
            font-family: var(--font-mono);
            font-weight: 700;
            color: #ffffff;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            font-weight: 700;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
        }

        .font-mono {
            font-family: var(--font-mono);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .badge-ev-pos {
            background: rgba(0, 255, 135, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 135, 0.4);
        }

        .badge-ev-neg {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 51, 102, 0.4);
        }

        .badge-ev-neutral {
            background: rgba(255, 170, 0, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(255, 170, 0, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px 14px;
            }
            .grid-inputs {
                grid-template-columns: 1fr;
            }
            .market-selector {
                flex-direction: column;
            }
            th, td {
                padding: 10px 8px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Quantum Devig & EV Finder</h1>
        <p>Eliminación de margen (Proporcional) + Búsqueda de Valor por Modelo Poisson</p>
    </header>

    <div class="market-selector">
        <button class="market-btn active" onclick="switchMarket('1X2')">Mercado 1X2</button>
        <button class="market-btn" onclick="switchMarket('OU')">Over / Under</button>
        <button class="market-btn" onclick="switchMarket('BTTS')">Both Teams To Score</button>
    </div>

    <div class="grid-inputs" id="inputsContainer">
        <!-- Renderizado dinámico vía JavaScript -->
    </div>

    <div class="margin-banner">
        <div class="margin-item">
            <span class="label">Overround (Suma Prob. Implícitas)</span>
            <span class="val" id="overroundVal">0.00%</span>
        </div>
        <div class="margin-item">
            <span class="label">Margen de la Casa</span>
            <span class="val" id="marginVal" style="color: var(--accent-amber);">0.00%</span>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Opción</th>
                    <th>Cuota Bookie</th>
                    <th>Prob. Implícita</th>
                    <th>Prob. Real (Sin Margen)</th>
                    <th>Cuota Justa (Fair)</th>
                    <th>Prob. Poisson</th>
                    <th>EV (%)</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <!-- Resultados renderizados dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentMarket = '1X2';

    const marketConfigs = {
        '1X2': [
            { id: '1', name: 'Local (1)', defaultOdd: 2.10, defaultPoisson: 46.50 },
            { id: 'X', name: 'Empate (X)', defaultOdd: 3.40, defaultPoisson: 27.20 },
            { id: '2', name: 'Visitante (2)', defaultOdd: 3.60, defaultPoisson: 26.30 }
        ],
        'OU': [
            { id: 'O', name: 'Over 2.5', defaultOdd: 1.90, defaultPoisson: 53.50 },
            { id: 'U', name: 'Under 2.5', defaultOdd: 1.95, defaultPoisson: 46.50 }
        ],
        'BTTS': [
            { id: 'Y', name: 'BTTS Sí', defaultOdd: 1.85, defaultPoisson: 56.00 },
            { id: 'N', name: 'BTTS No', defaultOdd: 2.00, defaultPoisson: 44.00 }
        ]
    };

    function switchMarket(market) {
        currentMarket = market;
        document.querySelectorAll('.market-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(market) || (market === 'OU' && btn.innerText.includes('Over')) || (market === 'BTTS' && btn.innerText.includes('Both')));
        });
        renderInputs();
        calculate();
    }

    function renderInputs() {
        const container = document.getElementById('inputsContainer');
        container.innerHTML = '';
        const config = marketConfigs[currentMarket];

        config.forEach(item => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `
                <h3>${item.name}</h3>
                <div class="input-group">
                    <label>Cuota Casa de Apuestas</label>
                    <input type="number" id="odd_${item.id}" step="0.01" value="${item.defaultOdd}" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>Probabilidad Poisson (%)</label>
                    <input type="number" id="poisson_${item.id}" step="0.1" value="${item.defaultPoisson}" oninput="calculate()">
                </div>
            `;
            container.appendChild(card);
        });
    }

    function calculate() {
        const config = marketConfigs[currentMarket];
        let totalImplicit = 0;
        const data = [];

        // 1. Obtener valores y calcular probabilidades implícitas
        config.forEach(item => {
            const odd = parseFloat(document.getElementById(`odd_${item.id}`).value) || 0;
            const poisson = parseFloat(document.getElementById(`poisson_${item.id}`).value) || 0;
            const implicitProb = odd > 0 ? (1 / odd) : 0;
            totalImplicit += implicitProb;

            data.push({
                name: item.name,
                odd: odd,
                poisson: poisson / 100,
                implicitProb: implicitProb
            });
        });

        // 2. Margen de la casa
        const margin = totalImplicit > 0 ? (totalImplicit - 1) * 100 : 0;
        const overround = totalImplicit * 100;

        document.getElementById('overroundVal').innerText = `${overround.toFixed(2)}%`;
        document.getElementById('marginVal').innerText = `${margin.toFixed(2)}%`;

        // 3. Devigging proporcional y cálculo de EV
        const tbody = document.getElementById('resultsTable');
        tbody.innerHTML = '';

        data.forEach(item => {
            const realProb = totalImplicit > 0 ? (item.implicitProb / totalImplicit) : 0;
            const fairOdd = realProb > 0 ? (1 / realProb) : 0;
            
            // Expected Value (+EV): (Probabilidad Modelo * Cuota Bookie) - 1
            const ev = (item.poisson * item.odd) - 1;
            const evPercent = ev * 100;

            let evBadgeClass = 'badge-ev-neutral';
            if (evPercent > 0) evBadgeClass = 'badge-ev-pos';
            else if (evPercent < 0) evBadgeClass = 'badge-ev-neg';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:700; color: var(--accent-cyan);">${item.name}</td>
                <td class="font-mono">${item.odd.toFixed(2)}</td>
                <td class="font-mono">${(item.implicitProb * 100).toFixed(2)}%</td>
                <td class="font-mono" style="font-weight:700; color: var(--accent-green);">${(realProb * 100).toFixed(2)}%</td>
                <td class="font-mono">${fairOdd > 0 ? fairOdd.toFixed(2) : '-'}</td>
                <td class="font-mono">${(item.poisson * 100).toFixed(2)}%</td>
                <td>
                    <span class="badge ${evBadgeClass}">
                        ${evPercent >= 0 ? '+' : ''}${evPercent.toFixed(2)}%
                    </span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Inicializar al cargar
    renderInputs();
    calculate();
</script>

</body>
</html>
